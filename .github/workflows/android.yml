name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cài Android SDK 34 (dùng SDK có sẵn trên máy chạy)
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "Dùng $SDKM"
          set +o pipefail
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0"

      - name: Chuẩn bị file web (www)
        run: |
          mkdir -p www
          cp index.html manifest.json icon.svg www/
          cp *.png *.jpg www/

      - name: Cài Capacitor
        run: npm install

      - name: Tạo dự án Android
        run: npx cap add android

      - name: Tạo icon + tinh chỉnh (toàn màn hình, số phiên bản)
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 16.${{ github.run_number }}
        run: |
          pip install pillow
          python3 scripts/make_icons.py android/app/src/main/res
          python3 scripts/patch_android.py

      - name: Đồng bộ web vào Android
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Đổi tên APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk CaVoiNho.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CaVoiNho-apk
          path: CaVoiNho.apk

      - name: Đăng APK lên Releases (khi đẩy tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: CaVoiNho.apk
