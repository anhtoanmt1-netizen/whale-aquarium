<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b5d8f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link rel="apple-touch-icon" href="icon-192.png">

<title>Cá Voi Nhỏ</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#0b5d8f;font-family:'Montserrat',system-ui,sans-serif;touch-action:none;color:#35506b}
button{font-family:inherit;cursor:pointer;transition:transform .15s,filter .2s,box-shadow .2s}
button:active{transform:scale(.95);filter:brightness(.96)}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
/* HUD */
#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 6px) calc(env(safe-area-inset-right,0px) + 8px) 6px calc(env(safe-area-inset-left,0px) + 8px);display:flex;flex-direction:column;gap:6px;z-index:2}
.row{display:flex;gap:6px;align-items:center}
.pill{background:#ffffffee;color:#0b5d8f;font-weight:800;border-radius:20px;padding:7px 12px;font-size:14px;box-shadow:0 2px 0 #0002;white-space:nowrap}
#sp{flex:1}
#gear{width:42px;height:42px;border:0;border-radius:50%;background:#ffffffee;font-size:21px;box-shadow:0 2px 0 #0002;transition:transform .6s cubic-bezier(.2,1.2,.4,1)}
body.so #gear{transform:rotate(180deg)}
.b{flex:1;min-width:0;border:0;border-radius:15px;padding:7px 2px;font-weight:700;font-size:11px;line-height:1.2;box-shadow:0 3px 0 #0003}
.b:disabled{opacity:.45}
.b.f{background:#cfe8fb;color:#1d5f94}.b.k{background:#ffd9d2;color:#a8402f}.b.e{background:#ffe9b0;color:#7a5200}.b.s{background:#d3f1e2;color:#1f7a57}
#shopb{width:42px;height:42px;border:0;border-radius:50%;background:#ffffffee;font-size:21px;box-shadow:0 2px 0 #0002}
#msg{position:fixed;left:0;right:0;top:120px;text-align:center;color:#fff;font-weight:700;font-size:14px;text-shadow:0 2px 6px #0009;pointer-events:none;z-index:30;padding:0 12px}
/* Overlay */
.ov{position:fixed;inset:0;background:#0a2a4a99;backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:10;padding:10px;opacity:0;pointer-events:none;transition:opacity .25s}
.ov.on{opacity:1;pointer-events:auto}
.pn{background:#fbfdff;border-radius:24px;padding:14px;width:100%;max-width:420px;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 50px #0006;transform:translateY(24px) scale(.95);transition:transform .4s cubic-bezier(.2,1.2,.4,1)}
.ov.on .pn{transform:none}
.ph{display:flex;align-items:center;justify-content:space-between}
.ph h3{margin:0;font-size:19px;font-weight:800;color:#2d4a66}
.x{width:36px;height:36px;border:0;border-radius:50%;background:#eef3f8;color:#5b7690;font-size:16px;font-weight:700}
.cd{border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:9px;opacity:0;transform:translateY(14px)}
.ov.on .cd{animation:up .5s ease forwards;animation-delay:var(--d,0s)}
@keyframes up{to{opacity:1;transform:none}}
.cd h4{margin:0;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800;color:var(--ac)}
.cd h4 i{font-style:normal;width:30px;height:30px;border-radius:10px;background:#fff;display:grid;place-items:center;font-size:16px;box-shadow:0 2px 6px #0001}
.cd h4 small{margin-left:auto;background:#fff;color:var(--ac);padding:2px 9px;border-radius:10px;font-size:11px}
.cd>small{font-size:11px;color:#6f8aa3;text-align:center;font-weight:500}
.lav{background:#efeafd;--ac:#7a6bd0}.mint{background:#e4f6ee;--ac:#3fa57f}.sky{background:#e2f0fb;--ac:#3f8cc6}.peach{background:#fff0e4;--ac:#e08848}
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:7px}
.chip{border:2px solid transparent;background:#fff;border-radius:14px;padding:8px 4px;font-size:18px;font-weight:700;color:#5d4fb0;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;box-shadow:0 2px 0 #7a6bd01f}
.chip span{font-size:10.5px;font-weight:700}
.chip.on{background:#7a6bd0;color:#fff;border-color:#fff;box-shadow:0 4px 12px #7a6bd055;transform:translateY(-1px)}
.eq{display:none;position:absolute;top:5px;right:6px;gap:2px;height:10px;align-items:flex-end}
.chip.on .eq{display:flex}
.eq u{display:block;width:3px;background:#fff;border-radius:2px;animation:eq .9s ease-in-out infinite}
.eq u:nth-child(2){animation-delay:.3s}.eq u:nth-child(3){animation-delay:.6s}
@keyframes eq{0%,100%{height:3px}50%{height:10px}}
.vol{display:flex;align-items:center;gap:8px;font-size:14px}
input[type=range]{flex:1;width:100%;appearance:none;height:8px;border-radius:6px;background:#fff;outline:none}
input[type=range]::-webkit-slider-thumb{appearance:none;width:24px;height:24px;border-radius:50%;background:var(--ac,#7a6bd0);border:3px solid #fff;box-shadow:0 2px 6px #0003}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--ac,#7a6bd0);border:3px solid #fff}
.r2{display:flex;align-items:center;justify-content:space-between;gap:8px;border:0;background:#fff;border-radius:14px;padding:11px 12px;font-size:13px;font-weight:700;color:#2f6e58;text-align:left;box-shadow:0 2px 0 #3fa57f22;width:100%}
.r2 em{font-style:normal;font-size:20px;color:#3fa57f}
.sw{width:42px;height:24px;border-radius:14px;background:#cfd9e2;position:relative;flex:none;transition:background .25s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0003;transition:transform .25s cubic-bezier(.2,1.4,.4,1)}
.r2.on .sw,input:checked+.sw{background:#3fa57f}
.r2.on .sw::after,input:checked+.sw::after{transform:translateX(18px)}
label.r2{color:#a35a1f}label.r2 input{display:none}label.r2 input:checked+.sw{background:#e08848}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:8px}
.tl{aspect-ratio:1;border-radius:14px;background:#fff;border:3px solid transparent;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:var(--ac);overflow:hidden;transition:transform .2s,border-color .2s,box-shadow .2s;cursor:pointer;box-shadow:0 2px 6px #0001}
.tl b{font-size:10px}.tl:hover{transform:translateY(-2px) scale(1.04)}
.tl.sel{border-color:var(--ac);box-shadow:0 0 0 3px #fff,0 4px 12px #0003;animation:pop .35s}
@keyframes pop{50%{transform:scale(1.1)}}
.tl img{width:100%;height:100%;object-fit:cover;background:repeating-conic-gradient(#dde 0 25%,#fff 0 50%) 0 0/12px 12px}
.tl.add{border:2px dashed var(--ac);background:#ffffff88}
.tl.full{opacity:.6}
.dx{position:absolute;top:3px;right:3px;width:22px;height:22px;border:0;border-radius:50%;background:#000a;color:#fff;font-size:11px;display:grid;place-items:center;padding:0}
.m{border:0;border-radius:16px;padding:12px;background:#e6f3fb;color:#0b5d8f;font-weight:800;font-size:14px}
.m.p{background:linear-gradient(135deg,#5eb3e8,#7a8fe0);color:#fff;box-shadow:0 4px 12px #5eb3e866}
.m.g{background:#eef3f8;color:#5b7690}
.two{display:flex;gap:8px}.two .m{flex:1}
#cc{align-self:center;border-radius:12px;background:repeating-conic-gradient(#dde 0 25%,#fff 0 50%) 0 0/16px 16px;touch-action:none;box-shadow:0 4px 14px #0002}
select{padding:10px;border-radius:12px;border:2px solid #d5e4f0;font-family:inherit;font-weight:600;color:#35506b;background:#fff}

.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:2px solid transparent;background:#fff;color:#3f8cc6;border-radius:14px;padding:7px 11px;font-size:12px;font-weight:700;box-shadow:0 2px 0 #3f8cc622}
.tabs button.on{background:#3f8cc6;color:#fff;border-color:#fff;box-shadow:0 4px 10px #3f8cc655}
.tl.di b{position:absolute;bottom:0;left:0;right:0;background:#fffd;font-size:9.5px;padding:1px 0;text-align:center}
.shg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.shp{border:0;border-radius:18px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;color:#35506b;box-shadow:0 3px 0 #0001;text-align:center}
.shp .ic{height:56px;display:grid;place-items:center;font-size:38px}
.shp .ic img{max-height:56px;max-width:84px;object-fit:contain}
.shp b{font-size:13px;font-weight:800}
.shp small{font-size:10.5px;color:#6f8aa3;font-weight:500;line-height:1.25;min-height:26px}
.shp em{font-style:normal;background:#fff;border-radius:12px;padding:4px 11px;font-size:12px;font-weight:800;color:#2d4a66}
.shp .cn{position:absolute;top:6px;right:6px;background:#fff;border-radius:9px;padding:1px 7px;font-size:10px;font-weight:800;font-style:normal;color:#2d4a66}
.shp:disabled{opacity:.5;filter:grayscale(.3)}
.s1{background:#e2f0fb}.s2{background:#e8e4fb}.s3{background:#fff0e4}.s4{background:#ffe4e0}.s5{background:#fff6d6}.s6{background:#e4f6ee}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><div class="row"><div class="pill" id="coins">🪙 0</div><div class="pill" id="cnt">🐋 0/10</div><div id="sp"></div><button id="shopb" aria-label="Cửa hàng">🛒</button><button id="gear" aria-label="Cài đặt">⚙️</button></div></div>
<div id="msg"></div>

<div class="ov" id="shop"><div class="pn">
  <div class="ph"><h3>🛒 Cửa hàng</h3><div class="pill" id="coins2">🪙 0</div><button class="x" id="shclose" aria-label="Đóng">✕</button></div>
  <div class="shg">
    <button class="shp s1" id="buy"><i class="cn" id="c_buy"></i><span class="ic">🐋</span><b>Cá voi</b><small>Lớn lên sẽ đẻ xu</small><em id="p_buy">100</em></button>
    <button class="shp s2" id="sword"><i class="cn" id="c_sword"></i><span class="ic"><img src="sword.png" alt=""></span><b>Cá kiếm</b><small>Lao đâm quái vật rất hung hăng</small><em id="p_sword">300</em></button>
    <button class="shp s3" id="horse"><i class="cn" id="c_horse"></i><span class="ic"><img src="horse.png" alt=""></span><b>Cá ngựa</b><small>Phun thức ăn cho cá</small><em id="p_horse">250</em></button>
    <button class="shp s4" id="crab"><i class="cn" id="c_crab"></i><span class="ic"><img src="crab.png" alt=""></span><b>Cua</b><small>Nhặt xu ở đáy hồ</small><em id="p_crab">200</em></button>
    <button class="shp s5" id="up"><i class="cn" id="c_up"></i><span class="ic">🍤</span><b>Thức ăn</b><small>Thả được nhiều viên hơn</small><em id="p_up">150</em></button>
    <button class="shp s6" id="slot"><i class="cn" id="c_slot"></i><span class="ic">🏝️</span><b>+5 chỗ</b><small>Hồ rộng hơn (tối đa 50 cá)</small><em id="p_slot">300</em></button>
  </div>
</div></div>

<div class="ov" id="set"><div class="pn">
  <div class="ph"><h3>⚙️ Cài đặt</h3><button class="x" id="sclose" aria-label="Đóng">✕</button></div>

  <section class="cd lav" style="--d:.05s"><h4><i>🎧</i>Âm thanh</h4>
    <div class="chips" id="snd">
      <button class="chip" data-k="off">🔇<span>Tắt</span></button>
      <button class="chip" data-k="wave">🌊<span>Sóng biển</span><i class="eq"><u></u><u></u><u></u></i></button>
      <button class="chip" data-k="pad">🌙<span>Hồ đêm</span><i class="eq"><u></u><u></u><u></u></i></button>
      <button class="chip" data-k="box">🎵<span>Hộp nhạc</span><i class="eq"><u></u><u></u><u></u></i></button>
      <button class="chip" data-k="bubble">🫧<span>Giọt nước</span><i class="eq"><u></u><u></u><u></u></i></button>
    </div>
    <div class="vol"><span>🔈</span><input type="range" id="vol" min="0" max="1" step=".05"><span>🔊</span></div>
  </section>

  <section class="cd mint" style="--d:.12s"><h4><i>📱</i>Hiển thị</h4>
    <button class="r2" id="land"><span>🔄 Màn hình ngang (toàn màn hình)</span><b class="sw"></b></button>
    <button class="r2" id="inst"><span>📲 Cài game vào điện thoại</span><em>›</em></button>
  </section>

  <section class="cd sky" style="--d:.19s"><h4><i>🖼️</i>Hình ảnh<small id="gn">0/5</small></h4>
    <div class="tabs" id="tabs">
      <button data-t="bg">🌊 Nền hồ</button><button data-t="fish">🐋 Cá voi</button><button data-t="sword">🗡️ Cá kiếm</button><button data-t="horse">🐴 Cá ngựa</button><button data-t="crab">🦀 Cua</button><button data-t="gold">🟡 Xu vàng</button><button data-t="silver">⚪ Xu bạc</button>
    </div>
    <div class="gal" id="gal"></div>
    <small id="ghint">Chạm để chọn · ✕ để xoá · tối đa 5 hình</small>
    <label class="r2" id="flipw"><span>↔️ Ảnh cá voi đang quay mặt sang trái</span><input type="checkbox" id="flip"><b class="sw"></b></label>
  </section>

  <button class="m p" id="sdone">Xong</button>
  <input type="file" id="file" accept="image/png,image/*" hidden>
</div></div>

<div class="ov" id="crop"><div class="pn">
  <div class="ph"><h3 id="ctitle">Cắt hình</h3></div>
  <select id="asp"><option value="screen">Tỉ lệ theo màn hình hiện tại</option><option value="16:9">Ngang 16:9</option><option value="9:16">Dọc 9:16</option></select>
  <canvas id="cc"></canvas>
  <input type="range" id="zm" min="0.3" max="4" step="0.05" value="1" style="--ac:#3f8cc6">
  <small style="text-align:center;color:#6f8aa3">Kéo ảnh để di chuyển · thanh trượt để phóng to / thu nhỏ</small>
  <div class="two"><button class="m g" id="cx">Huỷ</button><button class="m p" id="cs">Lưu</button></div>
</div></div>

<script>
const cv=document.getElementById('c'),c=cv.getContext('2d'),$=id=>document.getElementById(id);
let W,H,DPR,TOP=110;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;c.setTransform(DPR,0,0,DPR,0,0);TOP=$('hud').offsetHeight+6}
addEventListener('resize',resize);resize();
const R=(a,b)=>a+Math.random()*(b-a),cl=(v,a,b)=>a>b?(a+b)/2:Math.max(a,Math.min(b,v));
const MAXF=50;

let S=JSON.parse(localStorage.getItem('whale1')||'null')||{coins:50,lv:1,fish:[{stage:0,hunger:0},{stage:0,hunger:0}]};
S.crabs=S.crabs||0;S.swords=S.swords||0;S.horses=S.horses||0;S.flip=!!S.flip;S.cap=Math.min(MAXF,Math.max(S.cap||10,S.fish.length));S.snd=S.snd||'wave';S.vol=S.vol==null?.5:S.vol;
let fish=[],food=[],coins=[],bubbles=[],crabs=[],swords=[],horses=[],fx=[],alien=null,alienT=40,t=0,msgT=0;
const IM={},DEF={},img=n=>IM[n]||DEF[n];for(const n of['crab','sword','horse']){DEF[n]=new Image();DEF[n].src=n+'.png'}

const sz=f=>26+f.stage*9;
function bnd(f){const s=sz(f);return{x0:s*1.5,x1:W-s*1.5,y0:TOP+s*1.3,y1:H-s-12}}
function newFish(stage=0,hunger=0){const f={x:0,y:0,vx:R(-30,30),vy:0,dir:1,stage,hunger,eaten:0,coinT:R(4,8),spout:0,ph:R(0,6)};const b=bnd(f);f.x=R(b.x0,b.x1);f.y=R(b.y0,b.y1);f.tx=R(b.x0,b.x1);f.ty=R(b.y0,b.y1);f.x=cl(f.x,b.x0,b.x1);f.y=cl(f.y,b.y0,b.y1);return f}
function newCrab(){return{x:R(40,W-40),dir:1,vx:0,tx:R(40,W-40),ph:R(0,6)}}
S.fish.forEach(f=>fish.push(newFish(f.stage,f.hunger)));
function newSword(){return{x:R(80,W-80),y:R(TOP+60,H-100),vx:R(-30,30),vy:0,hx:-1,hy:0,tx:R(80,W-80),ty:R(TOP+60,H-100),cd:0,lunge:0,did:false,ph:R(0,6)}}
function newHorse(){return{x:R(60,W-60),y:R(TOP+60,H*.6),vx:0,vy:0,face:-1,tx:R(60,W-60),ty:R(TOP+60,H*.6),spitT:R(2,4),sp:0,ph:R(0,6)}}
for(let i=0;i<S.crabs;i++)crabs.push(newCrab());
for(let i=0;i<S.swords;i++)swords.push(newSword());
for(let i=0;i<S.horses;i++)horses.push(newHorse());
for(let i=0;i<34;i++)bubbles.push({amb:1,x:R(0,W),y:R(0,H),r:R(2,9),ph:R(0,6)});
const spk=[];for(let i=0;i<40;i++)spk.push({x:R(0,1),y:R(0,.85),r:R(3,7),s:R(.6,1.8),p:R(0,6.3)});
function save(){S.fish=fish.map(f=>({stage:f.stage,hunger:Math.floor(f.hunger)}));try{localStorage.setItem('whale1',JSON.stringify(S))}catch(e){}}
setInterval(save,4000);
function say(m){const e=$('msg');e.textContent=m;msgT=2.8}

// ================= ÂM THANH (WebAudio, không cần file) =================
let AC=null,MG,REV,cur=null;
function audioInit(){
  if(AC){AC.resume();return}
  AC=new(window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=S.vol*.8;MG.connect(AC.destination);
  REV=AC.createConvolver();const n=AC.sampleRate*2.4,b=AC.createBuffer(2,n,AC.sampleRate);
  for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3)}
  REV.buffer=b;REV.connect(MG);
}
function noise(brown){const n=AC.sampleRate*3,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);let l=0;
  for(let i=0;i<n;i++){const w=Math.random()*2-1;l=brown?(l+.02*w)/1.02:w;d[i]=brown?l*3.5:w}
  const s=AC.createBufferSource();s.buffer=b;s.loop=true;return s}
function lfo(freq,amt,param){const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=freq;g.gain.value=amt;o.connect(g);g.connect(param);o.start();return o}
function setSound(k){
  S.snd=k;save();
  if(cur){const o=cur,now=AC.currentTime;o.bus.gain.setTargetAtTime(0,now,.3);o.send.gain.setTargetAtTime(0,now,.3);setTimeout(()=>o.stops.forEach(f=>{try{f()}catch(e){}}),2000);cur=null}
  if(k=='off'||!AC)return;
  const now=AC.currentTime,bus=AC.createGain(),send=AC.createGain(),stops=[];
  bus.gain.value=0;bus.gain.setTargetAtTime(1,now,.9);send.gain.value=0;send.gain.setTargetAtTime(1,now,.9);bus.connect(MG);send.connect(REV);cur={bus,send,stops};
  const wet=(n,a)=>{n.connect(bus);const w=AC.createGain();w.gain.value=a;n.connect(w);w.connect(send)};
  const loopT=(fn,a,b)=>{let on=true;(function r(){if(!on)return;fn();setTimeout(r,R(a,b))})();stops.push(()=>on=false)};
  if(k=='wave'){
    const n=noise(1),f=AC.createBiquadFilter(),g=AC.createGain();f.type='lowpass';f.frequency.value=520;g.gain.value=.55;
    n.connect(f);f.connect(g);g.connect(bus);n.start();
    stops.push(()=>n.stop());
    const l1=lfo(.1,.3,g.gain),l2=lfo(.07,220,f.frequency);stops.push(()=>l1.stop(),()=>l2.stop());
  }else if(k=='pad'){

// ================= CẬP NHẬT =================
let tingT=0;
function update(dt){
  t+=dt;tingT-=dt;
  if(msgT>0){msgT-=dt;if(msgT<=0)$('msg').textContent=''}
  $('msg').style.top=(TOP+4)+'px';
  for(const f of food){f.x=cl(f.x+(f.vx||0)*dt,10,W-10);f.vx=(f.vx||0)*Math.pow(.15,dt);const vy=f.vy||0;f.vy=vy*Math.pow(.05,dt);if(f.y<H-30)f.y+=(45+vy)*dt;else{f.age+=dt;if(f.age>6)f.dead=true}}
  food=food.filter(f=>!f.dead);
  for(const f of fish){
    const s=sz(f),b=bnd(f);
    f.hunger+=dt*2.2;f.spout-=dt;if(Math.random()<dt*.15)f.spout=1;
    if(Math.random()<dt*.2&&bubbles.length<90)bubbles.push({x:f.x+f.dir*s*1.1,y:f.y-s*.2,r:R(2,4.5),ph:R(0,6)});
    let target=null,best=1e9;
    if(f.hunger>35)for(const o of food){const d=Math.hypot(o.x-f.x,o.y-f.y);if(d<best){best=d;target=o}}
    if(target){f.tx=target.x;f.ty=target.y}
    else if(Math.hypot(f.tx-f.x,f.ty-f.y)<20||Math.random()<dt*.1){f.tx=R(b.x0,b.x1);f.ty=R(b.y0,b.y1)}
    f.tx=cl(f.tx,b.x0,b.x1);f.ty=cl(f.ty,b.y0,b.y1);
    const dx=f.tx-f.x,dy=f.ty-f.y,d=Math.hypot(dx,dy)||1,sp=target?110:45;
    f.vx+=(dx/d*sp-f.vx)*dt*2;f.vy+=(dy/d*sp-f.vy)*dt*2;
    f.x+=f.vx*dt;f.y+=f.vy*dt;
    const nx=cl(f.x,b.x0,b.x1),ny=cl(f.y,b.y0,b.y1);if(nx!=f.x)f.vx*=-.3;if(ny!=f.y)f.vy*=-.3;f.x=nx;f.y=ny;
    if(Math.abs(f.vx)>8)f.dir=f.vx>0?1:-1;
    if(target&&Math.hypot(target.x-f.x,target.y-f.y)<s*1.3&&!target.dead){target.dead=true;f.hunger=0;f.eaten++;if(f.eaten>=4&&f.stage<2){f.stage++;f.eaten=0;say('Cá voi lớn lên! ✨')}}
    if(f.stage>0){f.coinT-=dt;if(f.coinT<=0){f.coinT=R(7,11);coins.push({x:f.x,y:f.y,v:f.stage==1?15:40,age:0,vy:-60,ph:R(0,6),rest:0,gold:f.stage==2})}}
    if(f.hunger>110){f.dead=true;say('Một chú cá đói quá 😢')}
  }
  fish=fish.filter(f=>!f.dead);
  if(!fish.length){fish.push(newFish());say('Tặng bạn một chú cá mới 🐋')}
  for(const k of coins){k.x=cl(k.x,16,W-16);if(!k.rest){k.vy+=(52-k.vy)*Math.min(1,dt*1.6);k.y+=k.vy*dt;k.x+=Math.sin(t*2+k.ph)*16*dt;if(k.y>=H-26){k.y=H-26;k.rest=1;k.age=0}}else k.age+=dt;if(k.age>10)k.dead=true}
  for(const cr of crabs){
    let tg=null,b=1e9;for(const k of coins){const d=Math.abs(k.x-cr.x)+(k.y<H-100?200:0);if(!k.dead&&d<b){b=d;tg=k}}
    if(tg)cr.tx=tg.x;else if(Math.abs(cr.tx-cr.x)<10||Math.random()<dt*.15)cr.tx=R(40,W-40);
    cr.tx=cl(cr.tx,30,W-30);
    const dx=cr.tx-cr.x;cr.vx+=((Math.abs(dx)>6?Math.sign(dx)*(tg?130:45):0)-cr.vx)*dt*4;cr.x=cl(cr.x+cr.vx*dt,30,W-30);if(Math.abs(cr.vx)>8)cr.dir=cr.vx>0?1:-1;
    for(const k of coins)if(!k.dead&&Math.abs(k.x-cr.x)<36&&k.y>H-90){S.coins+=k.v;k.dead=true;if(tingT<=0){ting();tingT=.25}}
  }
  coins=coins.filter(k=>!k.dead);
  alienT-=dt;
  if(!alien&&alienT<=0&&fish.length){alien={x:R(60,W-60),y:-40,hp:6+S.lv*2,max:6+S.lv*2,hit:0,eatT:2.5};say('⚠️ Quái vật xuất hiện! Chạm liên tục!')}
  if(alien){
    alien.hit-=dt;let n=null,b=1e9;for(const f of fish){const d=Math.hypot(f.x-alien.x,f.y-alien.y);if(d<b){b=d;n=f}}
    if(n){const d=b||1;alien.x=cl(alien.x+(n.x-alien.x)/d*55*dt,40,W-40);alien.y=Math.min(H-40,alien.y+(n.y-alien.y)/d*55*dt);
      if(b<50){alien.eatT-=dt;if(alien.eatT<=0){n.dead=true;alien.eatT=3.5;say('Cá bị ăn mất! 😱')}}}
  }
  // cá kiếm: lao đâm quái vật
  for(const w of swords){
    w.cd-=dt;
    if(alien){
      const dx=alien.x-w.x,dy=alien.y-w.y,d=Math.hypot(dx,dy)||1;
      if(w.lunge>0){w.lunge-=dt;
        if(!w.did&&d<64){w.did=true;alien.hp-=2;alien.hit=.3;alien.eatT=Math.max(alien.eatT,1.5);fx.push({x:alien.x,y:alien.y,l:.5,e:'💥'});
          if(alien.hp<=0){S.coins+=60;say('Cá kiếm hạ quái vật! +60 🪙');alien=null;alienT=R(35,55)}}
      }else{
        w.vx+=(dx/d*270-w.vx)*dt*3;w.vy+=(dy/d*270-w.vy)*dt*3;
        if(d<160&&w.cd<=0){w.lunge=.3;w.cd=1;w.did=false;w.vx=dx/d*580;w.vy=dy/d*580;fx.push({x:w.x,y:w.y-34,l:.6,e:'💢'})}
      }
    }else{
      w.lunge=0;
      if(Math.hypot(w.tx-w.x,w.ty-w.y)<30||Math.random()<dt*.08){w.tx=R(60,W-60);w.ty=R(TOP+50,H-70)}
      const dx=w.tx-w.x,dy=w.ty-w.y,d=Math.hypot(dx,dy)||1;w.vx+=(dx/d*75-w.vx)*dt*1.5;w.vy+=(dy/d*75-w.vy)*dt*1.5;
    }
    w.x+=w.vx*dt;w.y+=w.vy*dt;
    const nx=cl(w.x,50,W-50),ny=cl(w.y,TOP+35,H-55);if(nx!=w.x)w.vx*=-.4;if(ny!=w.y)w.vy*=-.4;w.x=nx;w.y=ny;
    const sp=Math.hypot(w.vx,w.vy);if(sp>15){const k=Math.min(1,dt*10);w.hx+=(w.vx/sp-w.hx)*k;w.hy+=(w.vy/sp-w.hy)*k}
  }
  // cá ngựa: phun thức ăn
  for(const h of horses){
    if(Math.hypot(h.tx-h.x,h.ty-h.y)<15||Math.random()<dt*.08){h.tx=R(60,W-60);h.ty=R(TOP+50,H*.65)}
    const dx=h.tx-h.x,dy=h.ty-h.y,d=Math.hypot(dx,dy)||1;h.vx+=(dx/d*28-h.vx)*dt;h.vy+=(dy/d*28-h.vy)*dt;
    h.x=cl(h.x+h.vx*dt,45,W-45);h.y=cl(h.y+h.vy*dt,TOP+50,H-90);if(Math.abs(h.vx)>6)h.face=h.vx>0?1:-1;
    h.sp-=dt;h.spitT-=dt;
    if(h.spitT<=0){h.spitT=R(3.5,6);
      if(food.length<16&&fish.some(f=>f.hunger>30)){
        const im=img('horse'),hh=96,ww=im&&im.naturalWidth?hh*im.naturalWidth/im.naturalHeight:62,mx=h.x+h.face*ww*.46,my=h.y-hh*.13;
        food.push({x:mx,y:my,vx:h.face*75,vy:-55,age:0});h.sp=.3;
        for(let i=0;i<3;i++)bubbles.push({x:mx,y:my,r:R(1.5,3),ph:R(0,6)});fx.push({x:mx+h.face*14,y:my-6,l:.4,e:'💦'})}}
  }
  for(let i=fx.length-1;i>=0;i--){fx[i].l-=dt;if(fx[i].l<=0)fx.splice(i,1)}
  for(let i=bubbles.length-1;i>=0;i--){const b=bubbles[i];b.y-=(14+b.r*5)*dt;b.x+=Math.sin(t*1.3+b.ph)*10*dt;
    if(b.y<-10){if(b.amb){b.y=H+10;b.x=R(0,W);b.r=R(2,9)}else bubbles.splice(i,1)}}
  hud();
}

// ================= VẼ =================
function whale(f){
  const s=sz(f),hungry=f.hunger>70;
  c.save();c.translate(f.x,f.y);
  if(IM.fish){
    const z=s*2.6;c.scale(f.dir*(S.flip?-1:1),1);c.rotate(Math.sin(t*6+f.ph)*.06);c.drawImage(IM.fish,-z/2,-z/2,z,z);c.restore();
    if(hungry){c.font='20px sans-serif';c.textAlign='center';c.fillText('😢',f.x,f.y-s*1.3)}return;
  }
  c.scale(f.dir,1);
  const wag=Math.sin(t*6+f.ph)*.25,fill=hungry?'#9fbf9f':'#8ea6cc',line='#566b94';
  c.lineWidth=2.5;c.strokeStyle=line;c.lineJoin='round';
  if(f.spout>0){c.strokeStyle='#bfe6ff';c.lineWidth=3;c.beginPath();c.moveTo(s*.1,-s*.9);c.lineTo(s*.1,-s*1.4);c.moveTo(s*.1,-s*1.4);c.quadraticCurveTo(s*-.1,-s*1.6,s*-.2,-s*1.35);c.moveTo(s*.1,-s*1.4);c.quadraticCurveTo(s*.3,-s*1.6,s*.4,-s*1.35);c.stroke();c.strokeStyle=line;c.lineWidth=2.5}
  c.save();c.translate(-s*.95,0);c.rotate(wag);c.fillStyle=fill;c.beginPath();
  c.moveTo(s*.3,0);c.bezierCurveTo(-s*.1,-s*.15,-s*.4,-s*.7,-s*.75,-s*.6);c.bezierCurveTo(-s*.55,-s*.2,-s*.55,s*.2,-s*.75,s*.6);c.bezierCurveTo(-s*.4,s*.7,-s*.1,s*.15,s*.3,0);c.fill();c.stroke();c.restore();
  c.fillStyle=fill;c.beginPath();c.ellipse(0,0,s*1.15,s*.9,0,0,7);c.fill();c.stroke();
  c.save();c.beginPath();c.ellipse(0,0,s*1.15,s*.9,0,0,7);c.clip();
  c.fillStyle='#fff';c.beginPath();c.ellipse(s*.15,s*.65,s*1.1,s*.55,0,0,7);c.fill();
  c.strokeStyle='#b9c8e3';c.lineWidth=1.5;for(let i=-3;i<=3;i++){c.beginPath();c.moveTo(s*(.15+i*.22),s*.3);c.lineTo(s*(.15+i*.22),s*.8);c.stroke()}c.restore();
  c.strokeStyle=line;c.lineWidth=2.5;c.beginPath();c.ellipse(0,0,s*1.15,s*.9,0,0,7);c.stroke();
  c.fillStyle=fill;c.beginPath();c.ellipse(-s*.1,s*.45,s*.3,s*.14,.6+Math.sin(t*5+f.ph)*.2,0,7);c.fill();c.stroke();
  c.fillStyle='#ff9fb0aa';c.beginPath();c.ellipse(s*.45,s*.2,s*.16,s*.1,0,0,7);c.fill();
  if(Math.sin(t*.9+f.ph*3)>.97){c.strokeStyle='#222';c.beginPath();c.arc(s*.6,-s*.05,s*.12,.2,2.9);c.stroke()}
  else{c.fillStyle='#222';c.beginPath();c.arc(s*.6,-s*.05,s*.17,0,7);c.fill();c.fillStyle='#fff';c.beginPath();c.arc(s*.65,-s*.1,s*.06,0,7);c.arc(s*.55,0,s*.03,0,7);c.fill()}
  c.strokeStyle='#222';c.lineWidth=2;c.beginPath();
  if(hungry)c.arc(s*.8,s*.38,s*.1,3.4,6);else c.arc(s*.8,s*.2,s*.1,.3,2.8);
  c.stroke();c.restore();
}
function rays(){
  for(let i=0;i<5;i++){
    const x=W*(.04+i*.22)+Math.sin(t*.2+i*1.7)*40,w=28+(i%2)*20,len=H*.95,sh=W*.16;
    const g=c.createLinearGradient(0,0,0,len);g.addColorStop(0,'rgba(255,255,225,'+(.22+.06*Math.sin(t*.6+i))+')');g.addColorStop(1,'rgba(255,255,225,0)');
    c.fillStyle=g;c.beginPath();c.moveTo(x,0);c.lineTo(x+w,0);c.lineTo(x+w+sh+30,len);c.lineTo(x+sh-30,len);c.fill();
  }
  const g=c.createLinearGradient(0,0,0,60);g.addColorStop(0,'rgba(255,255,255,.28)');g.addColorStop(1,'rgba(255,255,255,0)');c.fillStyle=g;c.fillRect(0,0,W,60);
}
function glitter(){
  c.fillStyle='#fffbe0';
  for(const p of spk){const a=Math.pow(Math.max(0,Math.sin(t*p.s+p.p)),3);if(a<.05)continue;
    const x=p.x*W+Math.sin(t*.3+p.p)*8,y=p.y*H+Math.cos(t*.25+p.p)*6,r=p.r*(.5+a*.7);c.globalAlpha=a*.9;
    c.beginPath();c.moveTo(x,y-r);c.quadraticCurveTo(x,y,x+r,y);c.quadraticCurveTo(x,y,x,y+r);c.quadraticCurveTo(x,y,x-r,y);c.quadraticCurveTo(x,y,x,y-r);c.fill()}
  c.globalAlpha=1;
}
function drawCrab(cr){const im=img('crab');if(!im||!im.naturalWidth)return;const r=im.naturalHeight/im.naturalWidth;let w=64,h=w*r;if(h>72){h=72;w=h/r}
  const bob=Math.abs(Math.sin(t*10+cr.ph))*(Math.abs(cr.vx)>10?4:0);c.save();c.translate(cr.x,H-8-bob);c.scale(cr.dir,1);c.drawImage(im,-w/2,-h,w,h);c.restore()}
function drawSword(w){const im=img('sword');if(!im||!im.naturalWidth)return;const ww=120,hh=ww*im.naturalHeight/im.naturalWidth,a=Math.atan2(w.hy,w.hx);
  c.save();c.translate(w.x,w.y);if(Math.cos(a)>=0){c.rotate(a);c.scale(-1,1)}else c.rotate(a-Math.PI);
  if(w.lunge<=0)c.rotate(Math.sin(t*5+w.ph)*.04);c.drawImage(im,-ww/2,-hh/2,ww,hh);c.restore()}
function drawHorse(h){const im=img('horse');if(!im||!im.naturalWidth)return;const hh=96,ww=hh*im.naturalWidth/im.naturalHeight,k=1+(h.sp>0?.1*h.sp/.3:0);
  c.save();c.translate(h.x,h.y+Math.sin(t*2+h.ph)*3);c.rotate(Math.sin(t*1.5+h.ph)*.07);c.scale(-h.face*k,k);c.drawImage(im,-ww/2,-hh/2,ww,hh);c.restore()}
function drawCoin(k){
  const im=IM[k.gold?'gold':'silver'],sx=k.rest?1:.35+.65*Math.abs(Math.cos(t*2.6+k.ph)),a=k.age>8?Math.max(0,1-(k.age-8)/2):1;
  c.save();c.globalAlpha=a;c.translate(k.x,k.y);c.scale(sx,1);
  if(im)c.drawImage(im,-18,-18,36,36);
  else{c.fillStyle=k.gold?'#ffc400':'#d6dde6';c.strokeStyle=k.gold?'#a87800':'#8895a5';c.lineWidth=2.5;c.beginPath();c.arc(0,0,16,0,7);c.fill();c.stroke();c.fillStyle=c.strokeStyle;c.font='bold 16px Montserrat,sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText('$',0,1)}
  c.restore();
}
function drawFx(){c.textAlign='center';c.textBaseline='middle';c.font='22px sans-serif';for(const f of fx){c.globalAlpha=Math.min(1,f.l*2.5);c.fillText(f.e,f.x,f.y-(.6-f.l)*30)}c.globalAlpha=1}
function draw(){
  if(IM.bg){const s=Math.max(W/IM.bg.width,H/IM.bg.height),w=IM.bg.width*s,h=IM.bg.height*s;c.drawImage(IM.bg,(W-w)/2,(H-h)/2,w,h)}
  else{
    const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#3aa8e0');g.addColorStop(1,'#0b4f80');c.fillStyle=g;c.fillRect(0,0,W,H);
    c.fillStyle='#e8cf8a';c.beginPath();c.moveTo(0,H);for(let x=0;x<=W;x+=20)c.lineTo(x,H-14+Math.sin(x*.05)*5);c.lineTo(W,H);c.fill();
  }
  rays();
  c.lineWidth=1.2;
  for(const b of bubbles){const x=b.x+Math.sin(t*.8+b.ph)*6,a=Math.min(1,Math.max(0,b.y/(H*.12)));c.globalAlpha=a;
    c.fillStyle='rgba(255,255,255,.10)';c.strokeStyle='rgba(255,255,255,.5)';c.beginPath();c.arc(x,b.y,b.r,0,7);c.fill();c.stroke();
    c.fillStyle='rgba(255,255,255,.75)';c.beginPath();c.arc(x-b.r*.35,b.y-b.r*.35,Math.max(.8,b.r*.22),0,7);c.fill()}
  c.globalAlpha=1;
  for(const f of food){c.fillStyle=f.age>3?'#8a6b3a':'#ff8a4c';c.beginPath();c.arc(f.x,f.y,7,0,7);c.fill();c.fillStyle='#fff6';c.beginPath();c.arc(f.x-2,f.y-2,2.5,0,7);c.fill()}
  for(const cr of crabs)drawCrab(cr);
  for(const f of fish)whale(f);for(const h of horses)drawHorse(h);for(const w of swords)drawSword(w);
  for(const k of coins)drawCoin(k);
  glitter();drawFx();
  if(alien){const a=alien,w=Math.sin(t*8)*3;c.save();c.translate(a.x,a.y);if(a.hit>0)c.translate(R(-4,4),0);
    c.fillStyle='#7ed957';c.strokeStyle='#3c8a1d';c.lineWidth=3;c.beginPath();c.arc(0,0,38,0,7);c.fill();c.stroke();
    for(let i=-1;i<=1;i++){c.beginPath();c.moveTo(i*20,32);c.lineTo(i*20+w,52);c.stroke()}
    c.fillStyle='#fff';c.beginPath();c.arc(-13,-6,11,0,7);c.arc(13,-6,11,0,7);c.fill();c.fillStyle='#222';c.beginPath();c.arc(-11,-5,5,0,7);c.arc(15,-5,5,0,7);c.fill();
    c.strokeStyle='#222';c.beginPath();c.moveTo(-10,16);c.lineTo(-4,12);c.lineTo(4,16);c.lineTo(10,12);c.stroke();
    c.fillStyle='#0006';c.fillRect(-30,-56,60,7);c.fillStyle='#ff4d4d';c.fillRect(-30,-56,60*Math.max(0,a.hp/a.max),7);c.restore()}
}
let last=performance.now();
function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;update(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
say('Chạm màn hình để thả thức ăn 🍤');
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));
</script>
